services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:?set LLM_API_KEYS in .env (comma-separated, at least 2 keys)}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-2.5-flash}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
    volumes:
      - app_data:/data # SQLite file lives here, so history survives container restarts
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      # URL the *browser* uses to reach the backend
      API_URL: ${API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app_data:
